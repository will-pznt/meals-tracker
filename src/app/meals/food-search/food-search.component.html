<mat-form-field appearance="outline" class="search">
  <mat-icon matSuffix>search</mat-icon>
  <input type="text" placeholder="Add food to meal" matInput [formField]="searchForm.query" [matAutocomplete]="auto" />

  <mat-autocomplete
    #auto="matAutocomplete"
    [displayWith]="displayFn"
    (optionSelected)="selectFood($event.option.value)"
  >
    @if (loading()) {
      <mat-option class="loading-option">
        <mat-spinner diameter="30"></mat-spinner>
      </mat-option>
    }
    @for (food of filteredFoods(); track food.fdcId) {
      <mat-option [value]="food">
        {{ food.description }}
      </mat-option>
    }
  </mat-autocomplete>
</mat-form-field>
