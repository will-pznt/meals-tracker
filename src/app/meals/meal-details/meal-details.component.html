@if (foodItems().length > 0) {
  <table mat-table [dataSource]="foodItems()" [trackBy]="trackByFdcId" class="mat-elevation-z2">
    <ng-container matColumnDef="description">
      <th mat-header-cell *matHeaderCellDef>Name</th>
      <td mat-cell *matCellDef="let foodItem">{{ foodItem.description }}</td>
    </ng-container>

    <ng-container matColumnDef="quantity">
      <th mat-header-cell *matHeaderCellDef>Quantity (g)</th>
      <td mat-cell *matCellDef="let foodItem">
        <input
          type="number"
          inputmode="numeric"
          appMinMax
          [min]="minQuantity"
          [max]="maxQuantity"
          [value]="foodItem.quantity"
          [attr.aria-label]="'Quantity in grams for ' + foodItem.description"
          (clampedValue)="onQuantityInput(foodItem, $event)"
          (blur)="onQuantityBlur(foodItem, $event)"
        />
      </td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>Actions</th>
      <td mat-cell *matCellDef="let foodItem">
        <button
          mat-icon-button
          color="warn"
          [attr.aria-label]="'Remove ' + foodItem.description"
          (click)="deleteFoodItem(foodItem)"
        >
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="columnsToDisplay"></tr>
    <tr mat-row *matRowDef="let element; columns: columnsToDisplay"></tr>
  </table>
} @else {
  <div class="empty-state">
    <mat-icon class="empty-icon" color="primary">restaurant_menu</mat-icon>
    <p class="empty-text">Your meal is empty! Start adding food items to track your nutrition.</p>
  </div>
}
