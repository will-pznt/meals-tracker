<div class="flex-container">
  @for (row of rows(); track row.nutrientName) {
    <div class="item-container">
      <span class="label">
        <span class="icon" aria-hidden="true">{{ row.icon }}</span>
        <span class="label-text">{{ row.label }}</span>
        <span class="unitName">({{ row.unitName }}{{ row.isLimit ? ', max' : '' }})</span>
      </span>
      <div
        class="bar-container"
        role="progressbar"
        [attr.aria-label]="row.label"
        aria-valuemin="0"
        aria-valuemax="100"
        [attr.aria-valuenow]="row.percent"
      >
        <div class="bar-fill" [style.width.%]="row.percent" [class.over]="row.over" [class.low]="row.low"></div>
        <span class="bar-text">{{ row.percent }}%</span>
      </div>
      <span>{{ row.value }} / {{ row.target }}</span>
    </div>
  }
</div>
