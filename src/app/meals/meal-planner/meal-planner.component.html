<div class="meal-toggle-container">
  <div class="left-and-middle">
    <div class="left-controls" role="group" aria-label="Select meal">
      @for (tab of mealTabs; track tab) {
        <button
          type="button"
          class="meal-button"
          [class.selected]="selectedMeal() === tab"
          [attr.aria-pressed]="selectedMeal() === tab"
          (click)="selectMeal(tab)"
        >
          {{ tab | titlecase }}
        </button>
      }
    </div>

    <div class="middle-row">
      <mat-form-field subscriptSizing="dynamic" class="date-field">
        <mat-label>Choose a date</mat-label>
        <input matInput [matDatepicker]="picker" [ngModel]="selectedDate()" (ngModelChange)="onDateChange($event)" />
        <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
        <mat-datepicker #picker></mat-datepicker>
      </mat-form-field>

      <div class="gender-field">
        <span class="gender-field-label">Targets for</span>
        <div class="gender-toggle" role="group" aria-label="Daily target profile">
          <div class="slider" [style.transform]="gender() === 'men' ? 'translateX(0%)' : 'translateX(100%)'"></div>
          <button
            type="button"
            class="gender-button"
            [class.selected]="gender() === 'men'"
            [attr.aria-pressed]="gender() === 'men'"
            (click)="setGender('men')"
          >
            Man
          </button>
          <button
            type="button"
            class="gender-button"
            [class.selected]="gender() === 'women'"
            [attr.aria-pressed]="gender() === 'women'"
            (click)="setGender('women')"
          >
            Woman
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="meal-container">
  @if (loading()) {
    <mat-spinner class="spinner"></mat-spinner>
  } @else {
    @let meal = selectedMeal();
    @if (meal !== 'daily') {
      <app-meal-display
        [selectedMeal]="meal"
        [foodItems]="currentItems()"
        [nutrients]="mealNutrients()"
        (addingFoodToMeal)="onFoodAdded($event)"
        (updatingQuantityFood)="onQuantityChanged($event)"
        (deletingFoodFromMeal)="onFoodDeleted($event)"
      ></app-meal-display>
    } @else {
      <app-daily-requirements [mealFoodItems]="mealFoodItems()"></app-daily-requirements>
    }
  }
</div>
