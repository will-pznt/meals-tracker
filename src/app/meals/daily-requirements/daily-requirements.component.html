<div class="cards-container">
  <mat-card class="daily-card" appearance="outlined">
    <mat-card-content>
      <mat-card-title class="card-title">Daily Summary</mat-card-title>
      <app-nutrients [nutrients]="dailyNutrients()"></app-nutrients>
    </mat-card-content>
  </mat-card>

  <mat-card class="daily-card recommendations-card" appearance="outlined">
    <mat-card-content>
      <mat-card-title class="card-title">Recommendations</mat-card-title>
      @if (lowNutrientsRecommendations().length === 0) {
        <div class="no-deficiency">Your daily intake meets all recommended values! 🎉</div>
      }
      @for (rec of lowNutrientsRecommendations(); track rec.nutrient.nutrientName) {
        <div class="recommendation nutrient-rec">
          <span class="nutrient-name">{{ rec.nutrient.label }}:</span>
          <span class="foods">{{ rec.foods.join(', ') }}</span>
        </div>
      }
    </mat-card-content>
  </mat-card>
</div>
